<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISTER E AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 22px;
      color: #555;
      margin-bottom: 50px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #666;
      font-size: 17px;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 30px;
      background: #111827;
      color: white;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
    }

    .footer {
      margin-top: 40px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      MISTER E AI
    </div>

    <div class="tagline">
      Know the card. Tell the story.
    </div>

    <div class="card">
      <h2>Your AI Trading Card Assistant</h2>

      <p>
        Upload a trading card and let Mister E AI help you
        understand it, tell its story, and create content around it.
      </p>

      <a class="button" href="#">
        CARD ANALYZER COMING SOON
      </a>
    </div>

    <div class="footer">
      MISTER E AI • Built for collectors and creators
    </div>

  </div>

</body>
</html>
